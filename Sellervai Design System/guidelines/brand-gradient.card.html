<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    body { margin: 0; padding: 28px; font-family: var(--sv-font-sans); display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--sv-accent-subtle); border: 1px solid color-mix(in srgb, var(--sv-purple) 35%, transparent); color: var(--sv-accent); padding: 5px 12px; border-radius: 100px; font-size: 13px; font-weight: 600; }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
    h1 em { font-style: normal; background: var(--sv-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .row { display: flex; gap: 12px; align-items: center; }
  </style>
</head>
<body>
  <span class="badge"><i class="ti ti-sparkles"></i> AI-Powered</span>
  <h1>Automate your store with <em>intelligent</em> AI</h1>
  <div class="row">
    <button class="sv-btn sv-btn-hero"><i class="ti ti-rocket"></i>Start for free</button>
    <span style="font-size:12px;color:var(--sv-text-muted)">← the one gradient CTA per page</span>
  </div>
</body>
</html>
