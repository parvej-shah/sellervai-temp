<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="sm rest · default raised · lg modal · glow (hero only)" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 28px; font-family: var(--sv-font-sans); display: flex; gap: 28px; align-items: center; background: var(--sv-bg); }
    .b { width: 110px; height: 70px; background: var(--sv-surface); border-radius: var(--sv-radius); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--sv-text-muted); }
    .u { text-align: center; }
    .l { font-size: 10px; color: var(--sv-text-muted); margin-top: 10px; font-family: var(--sv-font-mono); }
  </style>
</head>
<body>
  <div class="u"><div class="b" style="box-shadow:var(--sv-shadow-sm)">rest</div><div class="l">--sv-shadow-sm</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--sv-shadow)">raised</div><div class="l">--sv-shadow</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--sv-shadow-lg)">modal</div><div class="l">--sv-shadow-lg</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--sv-shadow-glow);background:var(--sv-gradient);color:#fff">hero</div><div class="l">--sv-shadow-glow</div></div>
</body>
</html>
