<!-- @dsCard group="Brand" viewport="700x180" name="Logo & wordmark" subtitle="ti-robot mark in indigo + Sellervai wordmark, on light & dark" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    body { margin: 0; font-family: var(--sv-font-sans); display: grid; grid-template-columns: 1fr 1fr; }
    .panel { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 40px; }
    .light { background: var(--sv-bg); }
    .dark  { background: #0f1020; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--sv-gradient); display:flex; align-items:center; justify-content:center; color:#fff; font-size: 26px; box-shadow: var(--sv-shadow); }
  </style>
</head>
<body>
  <div class="panel light">
    <span class="brand" style="color:#181a2c"><span class="mark"><i class="ti ti-robot"></i></span>Sellervai</span>
  </div>
  <div class="panel dark">
    <span class="brand" style="color:#eef0fb"><span class="mark"><i class="ti ti-robot"></i></span>Sellervai</span>
  </div>
</body>
</html>
