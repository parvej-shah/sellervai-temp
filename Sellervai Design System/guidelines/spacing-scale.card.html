<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base — --sv-space-1 … 8" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 24px; font-family: var(--sv-font-sans); display: flex; align-items: flex-end; gap: 18px; }
    .u { text-align: center; }
    .bar { background: var(--sv-accent); border-radius: 3px; width: 28px; }
    .l { font-size: 10px; color: var(--sv-text-muted); margin-top: 6px; font-family: var(--sv-font-mono); }
  </style>
</head>
<body>
  <div class="u"><div class="bar" style="height:var(--sv-space-1)"></div><div class="l">1 · 4</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-2)"></div><div class="l">2 · 8</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-3)"></div><div class="l">3 · 12</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-4)"></div><div class="l">4 · 16</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-5)"></div><div class="l">5 · 24</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-6)"></div><div class="l">6 · 32</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-7)"></div><div class="l">7 · 48</div></div>
  <div class="u"><div class="bar" style="height:var(--sv-space-8)"></div><div class="l">8 · 64</div></div>
</body>
</html>
