<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 24px; }
    .spec { margin-bottom: 18px; }
    .spec:last-child { margin-bottom: 0; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--sv-text-muted); margin-bottom: 4px; }
    .sans { font-family: var(--sv-font-sans); font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
    .mono { font-family: var(--sv-font-mono); font-size: 22px; font-weight: 500; }
    .note { font-size: 12px; color: var(--sv-text-muted); }
  </style>
</head>
<body>
  <div class="spec">
    <div class="label">Plus Jakarta Sans · --sv-font-sans</div>
    <div class="sans">Sell smarter, every channel.</div>
    <div class="note">UI, headings &amp; display · weights 400 · 500 · 600 · 700 · 800</div>
  </div>
  <div class="spec">
    <div class="label">JetBrains Mono · --sv-font-mono</div>
    <div class="mono">৳ 84,200 · #ORD-10482 · 1234567890</div>
    <div class="note">IDs, code &amp; aligned figures · 400 · 500 · 600</div>
  </div>
</body>
</html>
