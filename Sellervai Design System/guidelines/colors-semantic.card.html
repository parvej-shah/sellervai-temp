<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success · warning · danger · info — distinct from brand" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .sw { border-radius: var(--sv-radius-sm); border: 1px solid var(--sv-border); overflow: clip; box-shadow: var(--sv-shadow-sm); }
    .chip { height: 48px; display:flex; align-items:flex-end; }
    .tint { height: 22px; width: 100%; }
    .meta { padding: 8px 10px; background: var(--sv-surface); }
    .name { font-size: 12px; font-weight: 600; }
    .val { font-size: 10px; color: var(--sv-text-muted); font-family: var(--sv-font-mono); }
  </style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--sv-success)"><div class="tint" style="background:var(--sv-success-subtle)"></div></div><div class="meta"><div class="name" style="color:var(--sv-success)">Success</div><div class="val">--sv-success</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-warning)"><div class="tint" style="background:var(--sv-warning-subtle)"></div></div><div class="meta"><div class="name" style="color:var(--sv-warning)">Warning</div><div class="val">--sv-warning</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-danger)"><div class="tint" style="background:var(--sv-danger-subtle)"></div></div><div class="meta"><div class="name" style="color:var(--sv-danger)">Danger</div><div class="val">--sv-danger</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-info)"><div class="tint" style="background:var(--sv-info-subtle)"></div></div><div class="meta"><div class="name" style="color:var(--sv-info)">Info</div><div class="val">--sv-info</div></div></div>
</body>
</html>
