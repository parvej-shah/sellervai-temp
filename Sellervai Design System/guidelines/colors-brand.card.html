<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Indigo + Purple" subtitle="Indigo = workhorse · Purple = flourish · gradient = signature" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .sw { border-radius: var(--sv-radius-sm); border: 1px solid var(--sv-border); overflow: clip; box-shadow: var(--sv-shadow-sm); }
    .chip { height: 64px; }
    .meta { padding: 8px 10px; }
    .name { font-size: 12px; font-weight: 600; color: var(--sv-text); }
    .val { font-size: 11px; color: var(--sv-text-muted); font-family: var(--sv-font-mono); }
  </style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--sv-indigo)"></div><div class="meta"><div class="name">Indigo</div><div class="val">--sv-indigo</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-accent-hover)"></div><div class="meta"><div class="name">Indigo hover</div><div class="val">--sv-accent-hover</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-purple)"></div><div class="meta"><div class="name">Purple</div><div class="val">--sv-purple</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-gradient)"></div><div class="meta"><div class="name">Gradient</div><div class="val">--sv-gradient</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sv-accent-subtle)"></div><div class="meta"><div class="name">Subtle tint</div><div class="val">--sv-accent-subtle</div></div></div>
</body>
</html>
